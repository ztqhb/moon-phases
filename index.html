<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌙 月相演变 3D 教学演示</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#060810;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;color:#fff;user-select:none;height:100vh;width:100vw}
    #canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}

    #loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;text-align:center;color:rgba(255,255,255,.35);font-size:14px;letter-spacing:2px;transition:opacity 1.2s}
    #loader .spinner{width:34px;height:34px;border:2px solid rgba(255,255,255,.06);border-top-color:#ffd700;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Top bar */
    #top-bar{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;background:rgba(0,0,0,.3);padding:10px 32px;border-radius:14px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.04)}
    #top-bar h1{font-size:18px;font-weight:600;letter-spacing:5px;background:linear-gradient(135deg,#f5e6b8,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
    #top-bar .phase-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:1px}
    #top-bar .phase-row #phase-name{font-size:24px;font-weight:500;letter-spacing:3px}
    #top-bar .phase-row #phase-sub{font-size:13px;color:rgba(255,255,255,.4);letter-spacing:1px}

    /* Bottom section */
    #bottom{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;width:min(720px,88vw)}
    #bottom .track{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.04);overflow:hidden}
    #bottom .fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,#ffd700,#ff9500);transition:width .08s linear}
    #bottom .marks{display:flex;justify-content:space-between;margin-top:4px;pointer-events:auto}
    #bottom .m{flex:1;text-align:center;color:rgba(255,255,255,.12);transition:all .35s;cursor:pointer;font-size:10px}
    #bottom .m .dot{display:block;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.08);margin:0 auto 2px;transition:all .35s}
    #bottom .m.act{color:#ffd700;transform:scale(1.1)}
    #bottom .m:hover{color:rgba(255,255,255,.55)}
    #bottom .m.act .dot{background:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.5)}
    #bottom .m .label{display:block;letter-spacing:.5px}
    #bottom .m .lunar{display:block;font-size:9px;letter-spacing:0;opacity:.55;margin-top:1px}

    #bottom .detail{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.18);letter-spacing:1px;pointer-events:none;height:18px;line-height:18px;transition:opacity .4s}

    /* Controls - 底部居中 */
    #ctrl-bar{
      position:fixed;top:24px;right:24px;   /* 右上角：不遮挡底部时间线 */
      z-index:10;display:flex;align-items:center;gap:10px;
      background:rgba(0,0,0,.35);backdrop-filter:blur(12px);
      padding:6px 14px;border-radius:24px;
      border:1px solid rgba(255,255,255,.06);
      pointer-events:auto;
    }
    #ctrl-bar button{
      width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);color:#fff;font-size:20px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .2s;flex-shrink:0;
    }
    #ctrl-bar button:hover{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.3);}
    #ctrl-bar button:active{transform:scale(.9);}
    #ctrl-bar .status{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:1px;white-space:nowrap}
    #ctrl-bar .status.on{color:rgba(255,215,0,.6)}
    #ctrl-bar .spacer{width:1px;height:24px;background:rgba(255,255,255,.06)}
    #ctrl-bar .spd{font-size:12px;color:rgba(255,255,255,.35);min-width:28px;text-align:center}
    #ctrl-bar .spd-row{display:flex;align-items:center;gap:4px;opacity:.5;transition:opacity .3s}
    #ctrl-bar .spd-row:hover{opacity:1}
    #ctrl-bar .spd-row input[type=range]{
      -webkit-appearance:none;width:60px;height:2px;
      background:rgba(255,255,255,.12);border-radius:1px;outline:none;
    }
    #ctrl-bar .spd-row input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
      background:#ffd700;border:none;cursor:pointer;box-shadow:0 0 6px rgba(255,215,0,.25);
    }
    #ctrl-bar .spd-row input[type=range]::-moz-range-thumb{
      width:11px;height:11px;border-radius:50%;background:#ffd700;border:none;cursor:pointer;
    }

    #hint{position:fixed;bottom:34px;left:24px;z-index:10;font-size:11px;color:rgba(255,255,255,.08);letter-spacing:1px;pointer-events:none}

    /* Orbit diagram */
    #orbit-wrapper{
      position:fixed;left:18px;bottom:72px;z-index:10;pointer-events:auto;
      width:280px;height:225px;border-radius:12px;
      background:rgba(6,6,12,.78);backdrop-filter:blur(6px);
      border:1px solid rgba(255,255,255,.04);overflow:hidden;
      box-shadow:0 4px 24px rgba(0,0,0,.5);
    }
    #orbit-wrapper .title{font-size:10px;color:rgba(255,255,255,.2);text-align:center;padding:6px 0 0;letter-spacing:1px;pointer-events:none}

    /* Quiz overlay */
    #quiz{position:fixed;inset:0;background:rgba(5,10,18,.94);z-index:20;display:flex;align-items:center;justify-content:center}
    #quiz.hidden{display:none}
    #quiz-card{width:min(720px,92vw);background:#f2f6fa;border-radius:16px;padding:28px 32px;color:#1a2a3a;max-height:92vh;overflow-y:auto}
    #quiz-card h2{font-size:22px;color:#1a5d99;margin-bottom:4px}
    #quiz-prog{font-size:14px;color:#7a8a9a;margin-bottom:16px}
    #quiz-q{font-size:20px;font-weight:700;margin-bottom:18px;line-height:1.5}
    .qopt{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;border-radius:10px;border:2px solid #d0dae4;background:#fff;font-size:17px;cursor:pointer;font-family:inherit;transition:all .15s}
    .qopt:hover{border-color:#3f9de0}
    .qopt.correct{border-color:#2e9e4f;background:#e6f7ec;color:#1e6b38}
    .qopt.wrong{border-color:#d64545;background:#fdeaea;color:#a32626}
    .qopt:disabled{cursor:default}
    #quiz-why{margin-top:14px;padding:12px 16px;border-radius:10px;background:#eef4fb;font-size:15px;line-height:1.6;display:none}
    #quiz-why.show{display:block}
    #quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
    #quiz-score{font-size:16px;color:#1a5d99;font-weight:700}
    .qbtn{padding:10px 24px;border-radius:22px;border:none;background:#1a5d99;color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
    .qbtn.ghost{background:#e0e8f0;color:#33475b}
    .qbtn.gold{background:#ffd700;color:#0e1a2a;font-weight:700}
    #orbit-canvas{width:100%;height:calc(100% - 18px);display:block;cursor:pointer}

    @media(max-width:768px){
      #top-bar{top:12px;padding:6px 16px}
      #top-bar h1{font-size:14px}
      #top-bar .phase-row #phase-name{font-size:18px}
      #center-title .big{font-size:38px;letter-spacing:6px}
      #bottom{width:92vw;bottom:20px}
      #ctrl-bar{top:64px;right:12px;padding:4px 10px;gap:8px}
      #ctrl-bar button{width:36px;height:36px;font-size:16px}
      #ctrl-bar .spd-row input[type=range]{width:42px}
      #ctrl-bar .status{font-size:10px}
      #orbit-wrapper{display:none}
      #hint{display:none}
    }
  
@media (max-width:560px){
  #topbar{flex-wrap:wrap;gap:6px;padding:8px 10px}
  #topbar h1{font-size:17px}
  #type-sub{display:none}
  .tb-tabs{order:3;flex-basis:100%;overflow-x:auto;justify-content:flex-start;gap:6px;padding-bottom:2px}
  .tab{padding:6px 10px;font-size:13px;flex:0 0 auto}
  .tb-actions{margin-left:auto}
  .abtn{padding:6px 10px;font-size:13px}
  #tipcard{width:min(250px,64vw)}
  .sbtn{font-size:12px;padding:3px 6px}
  .navbtn{padding:6px 10px;font-size:14px}
}
</style>

<script>

<script>
// 等待 Three.js 加载完成后初始化
(function waitForThree() {
  if (typeof THREE !== 'undefined') {
    initApp();
  } else if (THREE_LOAD_ERROR) {
    console.error(THREE_LOAD_ERROR);
  } else {
    setTimeout(waitForThree, 100);
  }
})();

function initApp() {

// ================================================================
//  月相数据 + 教学知识
// ================================================================
const PHASES = [
  {
    range:[0,0.03],   name:'新月（朔）', emoji:'🌑', cls:'nm', lunar:'初一',
    fact:'月球位于地球和太阳之间，黑暗面朝向地球，完全不可见。农历初一。'
  },{
    range:[0.03,0.22],name:'蛾眉月', emoji:'🌒', cls:'wc', lunar:'初三、初四',
    fact:'月球向东偏移，可见被照亮的一小部分，呈弯月（反C状，亮面朝西）。农历初三、初四。'
  },{
    range:[0.22,0.28],name:'上弦月', emoji:'🌓', cls:'fq', lunar:'初七、初八',
    fact:'月球与太阳夹角为90°，可见被照亮的西半边，呈半圆形（亮面朝西，弓背朝右）。农历初七、初八。'
  },{
    range:[0.28,0.47],name:'盈凸月', emoji:'🌔', cls:'wg', lunar:'初九至十四',
    fact:'可见被照亮的西大半边，呈饱满的弧形（亮面朝西，左侧有缺口）。农历初九至十四。'
  },{
    range:[0.47,0.53],name:'满月（望）', emoji:'🌕', cls:'fm', lunar:'十五、十六',
    fact:'月球位于地球外侧，亮面完全朝向地球，呈正圆形。农历十五、十六。'
  },{
    range:[0.53,0.72],name:'亏凸月', emoji:'🌖', cls:'wng', lunar:'十六至二十三',
    fact:'亮面开始从东侧亏缺，可见被照亮的东大半边（亮面朝东，右侧有缺口）。农历十六至二十三。'
  },{
    range:[0.72,0.78],name:'下弦月', emoji:'🌗', cls:'lq', lunar:'二十二、二十三',
    fact:'月球与太阳夹角为270°，可见被照亮的东半边，呈半圆形（亮面朝东，弓背朝左）。农历二十二、二十三。'
  },{
    range:[0.78,1.01],name:'残月（亏眉月）', emoji:'🌘', cls:'wnc', lunar:'二十四至月末',
    fact:'亮面仅剩一小部分，呈弯月（C状，亮面朝东）。农历二十四至月末。'
  }
];
function getPhase(v){const a=((v%1)+1)%1;for(const p of PHASES)if(a>=p.range[0]&&a<p.range[1])return p;return PHASES[7];}

// ================================================================
//  高级程序化月球纹理 (2048×1024)
// ================================================================
function hash2(px,py){const n=Math.sin(px*127.1+py*311.7)*43758.5453;return n-Math.floor(n);}
function snoise(x,y,sc){
  const sx=x/sc,sy=y/sc;const ix=Math.floor(sx),iy=Math.floor(sy);
  const fx=sx-ix,fy=sy-iy;const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);
  return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
}
function fbm(x,y,o=5){let v=0,amp=.5,f=1;for(let i=0;i<o;i++){v+=amp*snoise(x*f,y*f,2);f*=2.3;amp*=.48;}return v*2;}
function fmb(x,y){return fbm(x,y,6);}

function genMoonTex(w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');const img=ctx.createImageData(w,h);const d=img.data;

  // Mare positions (modeled from actual lunar map)
  const mares=[
    {x:.52,y:.43,rx:.14,ry:.10},{x:.58,y:.37,rx:.08,ry:.05},
    {x:.62,y:.45,rx:.09,ry:.07},{x:.67,y:.53,rx:.08,ry:.06},
    {x:.48,y:.57,rx:.10,ry:.07},{x:.37,y:.44,rx:.16,ry:.12},
    {x:.55,y:.52,rx:.07,ry:.04},{x:.44,y:.36,rx:.08,ry:.06},
    {x:.70,y:.42,rx:.06,ry:.04},{x:.34,y:.50,rx:.07,ry:.05},
  ];
  // Major craters
  const craters=[
    {x:.56,y:.32,r:12,n:'Tycho'},{x:.42,y:.38,r:8,n:'Copernicus'},
    {x:.50,y:.22,r:6,n:'Kepler'},{x:.65,y:.30,r:7,n:'Aristarchus'},
    {x:.58,y:.25,r:5,n:'Plato'},{x:.62,y:.60,r:7,n:'Langrenus'},
  ];

  for(let py=0;py<h;py++)for(let px=0;px<w;px++){
    const i=(py*w+px)*4;
    const nx=px/w,ny=py/h;

    // Multi-scale terrain
    let elev=.35+fmb(nx*6,ny*3)*.5+fbm(nx*12,ny*8,4)*.15+fbm(nx*25,ny*18,3)*.08+fbm(nx*60,ny*40,2)*.04;

    // Maria
    for(const m of mares){
      const dx=(nx-m.x)/m.rx,dy=(ny-m.y)/m.ry;
      const d2=dx*dx+dy*dy;
      if(d2<1){const f=1-Math.sqrt(d2);elev-=f*.32*(.7+.3*snoise(nx*35,ny*35,1));}
    }

    // Small craters
    for(let cj=0;cj<3;cj++){const sc=4+cj*3;
      const cx=Math.floor(px/sc),cy=Math.floor(py/sc);
      const seed=hash2(cx,cy);
      if(seed>.994){
        const r=(seed-.994)/.006*(2.5+cj);
        const ox=(hash2(cx+1,cy)-.5)*4,oy=(hash2(cx,cy+1)-.5)*4;
        const dist=Math.sqrt((px-(cx*sc+sc/2+ox))**2+(py-(cy*sc+sc/2+oy))**2);
        if(dist<r+1.5)elev+=Math.max(0,Math.sin(dist/(r+1.5)*Math.PI))*.15;
      }
    }

    // Ray systems from major craters
    for(const cr of craters){
      const cx=cr.x*w,cy=cr.y*h;
      const dist=Math.sqrt((px-cx)**2+(py-cy)**2);
      if(dist<cr.r*8){const f=Math.max(0,1-dist/(cr.r*8));elev+=f*.06*(.5+.5*snoise(nx*80,ny*80,1));}
    }

    // Named crater rims (visible brightening)
    for(const cr of craters){
      const cx=cr.x*w,cy=cr.y*h;
      const dist=Math.sqrt((px-cx)**2+(py-cy)**2);
      if(dist>cr.r*.6&&dist<cr.r*1.3)elev+=Math.max(0,Math.sin((dist-cr.r*.6)/(cr.r*.7)*Math.PI))*.10;
    }

    // Limb darkening
    const edge=Math.sqrt((nx-.5)**2+(ny-.5)**2)*1.4;
    elev-=Math.max(0,edge-.5)*.55;

    elev=Math.max(0,Math.min(1,elev));
    const b=Math.round(45+elev*180);
    d[i]=d[i+1]=d[i+2]=b;d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}

function genNormalMap(w,h){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');const img=ctx.createImageData(w,h);const d=img.data;
  const moonCanvas=genMoonTex(w,h);
  const mCtx=moonCanvas.getContext('2d');const mImg=mCtx.getImageData(0,0,w,h);
  const ht=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)ht[y*w+x]=mImg.data[(y*w+x)*4]/255;
  const st=.12;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const xL=ht[y*w+((x-1+w)%w)],xR=ht[y*w+((x+1)%w)];
    const yU=ht[((y-1+h)%h)*w+x],yD=ht[((y+1)%h)*w+x];
    const dx=(xR-xL)*st,dy=(yD-yU)*st;
    const ln=Math.sqrt(dx*dx+dy*dy+1);
    d[i]=Math.round((dx/ln*.5+.5)*255);
    d[i+1]=Math.round((dy/ln*.5+.5)*255);
    d[i+2]=Math.round((1/ln)*255);d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  return c;
}

// ================================================================
//  Three.js 场景
// ================================================================
const container=document.getElementById('canvas-container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x060810);

const camera=new THREE.PerspectiveCamera(36,container.clientWidth/container.clientHeight,.1,100);
camera.position.set(0,.2,5.2);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ================================================================
//  相机控制 — 增强版（自动缓动旋转 + 手动拖拽覆盖）
// ================================================================
let isDragging=false,prevX=0,prevY=0;
let camTheta=0,camPhi=.08;
const CAM_BASE=5.2;
let camDist=5.2;
let autoRotateSpeed=.06; // auto rotation when not dragging
let lastInteraction=0;

renderer.domElement.addEventListener('pointerdown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY;lastInteraction=performance.now();});
window.addEventListener('pointermove',e=>{if(!isDragging)return;const dx=e.clientX-prevX,dy=e.clientY-prevY;prevX=e.clientX;prevY=e.clientY;camTheta-=dx*.004;camPhi=Math.max(-.7,Math.min(.7,camPhi+dy*.004));lastInteraction=performance.now();});
window.addEventListener('pointerup',()=>{isDragging=false;});
renderer.domElement.addEventListener('wheel',e=>{camDist=Math.max(2.8,Math.min(12,camDist+e.deltaY*.004));e.preventDefault();},{passive:false});

// ================================================================
//  全景星空（双层 — 近景闪烁 + 远景静态）
// ================================================================
function makeStars(count,size,distMin,distMax){
  const p=new Float32Array(count*3);const c=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=distMin+Math.random()*(distMax-distMin);
    const t=Math.random()*Math.PI*2;const phi=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(phi)*Math.cos(t);
    p[i*3+1]=r*Math.cos(phi);
    p[i*3+2]=r*Math.sin(phi)*Math.sin(t);
    const b=.4+Math.random()*.6;
    const tint=Math.random();
    if(tint<.03){c[i*3]=b*.6;c[i*3+1]=b*.7;c[i*3+2]=b;}
    else if(tint<.06){c[i*3]=b;c[i*3+1]=b*.6;c[i*3+2]=b*.4;}
    else{c[i*3]=b;c[i*3+1]=b;c[i*3+2]=b;}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  return {mesh:new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,sizeAttenuation:true,transparent:true,opacity:.8,depthWrite:false})),colors:c,positions:p};
}
const nearStars=makeStars(2000,.18,35,80);
scene.add(nearStars.mesh);
const farStars=makeStars(800,.35,85,200);
scene.add(farStars.mesh);

// 月面贴图：使用用户提供的 moon.webp（黑底月盘照片 → 自动裁出月盘铺满球面，避免黑边）
function loadMoonPhoto(url){
  const img=new Image();
  img.onload=()=>{
    try{
      // 1) 检测月盘边界（亮度 > 15 的区域）
      const t=document.createElement('canvas');
      t.width=img.naturalWidth;t.height=img.naturalHeight;
      const tg=t.getContext('2d');
      tg.drawImage(img,0,0);
      const d=tg.getImageData(0,0,t.width,t.height).data;
      let minX=t.width,minY=t.height,maxX=0,maxY=0;
      for(let y=0;y<t.height;y+=2)for(let x=0;x<t.width;x+=2){
        const i=(y*t.width+x)*4;
        if(.299*d[i]+.587*d[i+1]+.114*d[i+2]>15){
          if(x<minX)minX=x;if(x>maxX)maxX=x;
          if(y<minY)minY=y;if(y>maxY)maxY=y;
        }
      }
      if(maxX<=minX||maxY<=minY){minX=0;minY=0;maxX=t.width;maxY=t.height;}
      // 2) 以月盘中心取正方形区域，画满 1024×1024
      const s=Math.max(maxX-minX,maxY-minY);
      let cx=(minX+maxX)/2,cy=(minY+maxY)/2;
      let sx=cx-s/2,sy=cy-s/2,sw=s,sh=s;
      if(sx<0){sw+=sx;sx=0;}
      if(sy<0){sh+=sy;sy=0;}
      if(sx+sw>t.width)sw=t.width-sx;
      if(sy+sh>t.height)sh=t.height-sy;
      const c=document.createElement('canvas');
      c.width=1024;c.height=1024;
      const g=c.getContext('2d');
      g.drawImage(img,sx,sy,sw,sh,0,0,1024,1024);
      const tex=new THREE.CanvasTexture(c);
      tex.colorSpace=THREE.SRGBColorSpace;
      mat.map=tex;mat.needsUpdate=true;
    }catch(e){console.warn('月面贴图处理失败，保留程序化纹理',e);}
  };
  img.onerror=()=>console.warn('moon.webp 加载失败，保留程序化纹理');
  img.src=url;
}

const orbitCanvas=document.getElementById('orbit-canvas');

function drawOrbit(v,highlightIdx){
  orbitValue=v;
  const ctx=orbitCanvas.getContext('2d');
  const W=orbitCanvas.width,H=orbitCanvas.height;
  const sc=W/280; // CSS ~280px

  ctx.clearRect(0,0,W,H);

  const sunX=W-20*sc,earthX=W*.48,earthY=H*.56,orbitR=Math.min(W,H)*.25;

  // Light rays
  ctx.strokeStyle='rgba(255,200,80,0.05)';ctx.lineWidth=1;
  for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(sunX,earthY+i*14*sc);ctx.lineTo(earthX-orbitR-4*sc,earthY+i*14*sc);ctx.stroke();}

  // Orbit
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1.5;ctx.setLineDash([4*sc,5*sc]);
  ctx.beginPath();ctx.arc(earthX,earthY,orbitR,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);

  // Sun
  const sg=ctx.createRadialGradient(sunX,earthY,3*sc,sunX,earthY,28*sc);
  sg.addColorStop(0,'rgba(255,210,60,.18)');sg.addColorStop(1,'rgba(255,210,60,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sunX,earthY,28*sc,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(sunX,earthY,9*sc,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.font=`${10*sc}px "PingFang SC",sans-serif`;ctx.textBaseline='top';ctx.textAlign='center';
  ctx.fillText('☀ 太阳',sunX,earthY+13*sc);

  // Earth
  ctx.fillStyle='#4488cc';ctx.beginPath();ctx.arc(earthX,earthY,7*sc,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(68,136,204,.1)';ctx.beginPath();ctx.arc(earthX,earthY,11*sc,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.textBaseline='top';ctx.fillText('🌍 地球',earthX,earthY+12*sc);

  // Moon angle
  const angle=v*2*Math.PI;
  const moonX=earthX+orbitR*Math.cos(angle);
  const moonY=earthY-orbitR*Math.sin(angle);

  // Earth-Moon line
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;ctx.setLineDash([2*sc,3*sc]);
  ctx.beginPath();ctx.moveTo(earthX,earthY);ctx.lineTo(moonX,moonY);ctx.stroke();ctx.setLineDash([]);

    // 月球（根据轨道角正确渲染从地球看到的月相）
  const mr=6.5*sc;
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(moonX,moonY,mr,0,Math.PI*2);ctx.fill();

  ctx.save();
  ctx.beginPath();ctx.arc(moonX,moonY,mr,0,Math.PI*2);ctx.clip();

  // 太阳在右侧，月亮逆时针公转
  // angle=0(右)=新月，angle=π/2(上)=上弦，angle=π(左)=满月，angle=3π/2(下)=下弦
  const termX=Math.cos(angle)*mr;
  const normA=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  if(normA<0.03||normA>2*Math.PI-0.03){
    // 新月（angle≈0/2π）：全暗
    ctx.beginPath();ctx.rect(0,0,0,0);ctx.clip();
  } else if(Math.abs(normA-Math.PI)<0.03){
    // 满月（angle≈π）：全亮，不裁剪
  } else if(normA<Math.PI){
    // 盈面（0→π，右上→上→左上→左）：亮面在右侧
    ctx.beginPath();ctx.rect(moonX+termX,moonY-mr,mr*2,mr*2);ctx.clip();
  } else {
    // 亏面（π→2π，左→左下→下→右下→右）：亮面在左侧
    ctx.beginPath();ctx.rect(moonX-mr,moonY-mr,mr-termX,mr*2);ctx.clip();
  }

  ctx.fillStyle='#f0e8d0';
  ctx.beginPath();ctx.arc(moonX,moonY,mr,0,Math.PI*2);ctx.fill();
  ctx.restore();

  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=.8;ctx.beginPath();ctx.arc(moonX,moonY,mr,0,Math.PI*2);ctx.stroke();

  const phase=getPhase(v);
  ctx.fillStyle='rgba(255,255,255,.15)';ctx.font=`${8*sc}px sans-serif`;ctx.textBaseline='bottom';ctx.textAlign='center';
  ctx.fillText(phase.emoji+' '+phase.name,moonX,moonY-mr-2*sc);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.textBaseline='top';ctx.font=`${9*sc}px "PingFang SC",sans-serif`;
  ctx.fillText('🌙 月球',moonX,moonY+mr+2*sc);

  // Labels
  ctx.fillStyle='rgba(255,200,80,.1)';ctx.font=`${8*sc}px sans-serif`;ctx.textBaseline='bottom';ctx.textAlign='left';
  ctx.fillText('☀ 太阳光 ←',sunX-orbitR*0.8,earthY-orbitR-6*sc);

  // Click hint
  ctx.fillStyle='rgba(255,255,255,.04)';ctx.font=`${7*sc}px sans-serif`;ctx.textBaseline='bottom';ctx.textAlign='right';
  ctx.fillText('点击跳转',W-4*sc,H-3*sc);
}

// 点击轨道图跳转
orbitCanvas.addEventListener('click',e=>{
  const rect=orbitCanvas.getBoundingClientRect();
  const x=e.clientX-rect.left;const y=e.clientY-rect.top;
  const sc=orbitCanvas.width/rect.width;
  const cx=x*sc,cy=y*sc;
  // Convert to diagram coordinates
  const W=orbitCanvas.width,H=orbitCanvas.height;
  const earthX=W*.48,earthY=H*.56,orbitR=Math.min(W,H)*.25;
  const dx=cx-earthX,dy=cy-earthY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(Math.abs(dist-orbitR)<orbitR*.4){
    // 反演绘制公式：moonY=earthY-orbitR*sin(2πv) ⇒ atan2(-dy,dx)=2πv
    let angle=Math.atan2(-dy,dx);
    let newV=((angle+2*Math.PI)%(2*Math.PI))/(2*Math.PI);
    accumulated=newV*1000;
    // Play the animation if paused
    if(!isPlaying){isPlaying=true;btnPlay.textContent='⏸';}
    updateAll(Math.round(accumulated));
  }
});

// 悬停检测
orbitCanvas.addEventListener('mousemove',e=>{
  const rect=orbitCanvas.getBoundingClientRect();
  const x=e.clientX-rect.left;const y=e.clientY-rect.top;
  const sc=orbitCanvas.width/rect.width;
  const cx=x*sc,cy=y*sc;
  const W=orbitCanvas.width,H=orbitCanvas.height;
  const earthX=W*.48,earthY=H*.56,orbitR=Math.min(W,H)*.25;
  const dist=Math.sqrt((cx-earthX)**2+(cy-earthY)**2);
  orbitCanvas.style.cursor=Math.abs(dist-orbitR)<orbitR*.4?'pointer':'default';
});

// Progress markers
const mkLabels=['新月','蛾眉月','上弦月','盈凸月','满月','亏凸月','下弦月','残月'];
const mkEmojis=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
const mkVals=[0,.125,.25,.375,.5,.625,.75,.875];
const mkContainer=document.getElementById('prog-marks');
mkLabels.forEach((n,i)=>{
  const d=document.createElement('div');d.className='m';
  d.innerHTML=`<span class="dot"></span><span class="label">${mkEmojis[i]} ${n}</span><span class="lunar">${getPhase(mkVals[i]).lunar}</span>`;
  // 点击月相标记直接跳转到该月相
  d.addEventListener('click',()=>{
    accumulated=mkVals[i]*1000;
    if(!isPlaying){isPlaying=true;btnPlay.textContent='⏸';playStatus.textContent='自动播放';playStatus.className='status on';}
    updateAll(Math.round(accumulated));
  });
  mkContainer.appendChild(d);
});

function updateAll(val){
  const v=val/1000;
  const angle=Math.PI-v*2*Math.PI;

  // 1. Rotate sunlight
  sunLight.position.set(Math.sin(angle)*8,.6,Math.cos(angle)*8);

  // 2. Earthshine position (opposite the sun, muted)
  earthshine.position.set(-Math.sin(angle)*5,.2,-Math.cos(angle)*5);

  // 3. Illumination
  const illum=(1-Math.cos(v*2*Math.PI))/2;
  const illumPct=(illum*100).toFixed(1);

  // 4. Phase info
  const phase=getPhase(v);
  phaseNameEl.textContent=`${phase.emoji} ${phase.name}`;
  phaseSubEl.textContent=`农历${phase.lunar} · 光照 ${illumPct}% · 周期 ${(v*29.53).toFixed(1)}d`;

  // 5. Progress
  progFill.style.width=`${(v*100)%100}%`;

  // 6. Markers
  document.querySelectorAll('.m').forEach((el,i)=>{
    const c=mkVals[i];let act=false;
    if(i===0)act=v>=.97||v<.03;
    else if(i===7)act=v>=.84&&v<.97;
    else act=v>=c-.06&&v<c+.06;
    el.classList.toggle('act',act);
  });

  // 7. Detail line
  const cyclePct=(illum*100).toFixed(0);
  detailEl.textContent=`${phase.emoji} ${phase.name} · ${phase.fact}`;

  // 8. 2D orbit diagram
  drawOrbit(v);
}

btnPlay.addEventListener('click',()=>{

    accumulated=0;

  btnPlay.textContent=isPlaying?'⏸':'▶';

});
spdSlider.addEventListener('input',()=>{speed=parseFloat(spdSlider.value);spdDisplay.textContent=`${speed.toFixed(1)}×`;});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('quiz').classList.contains('hidden')){closeQuiz();return;}
    return;
  }
  if(!$('quiz').classList.contains('hidden'))return;   // 测验进行中只响应 ESC

  else if(e.key==='t'||e.key==='T'){openQuiz();}
});

/* ================================================================
   随堂测验（月相知识 8 题）
   ================================================================ */
const QUIZ=[
  { q:'月相变化的周期（朔望月）大约是（　）',
    opts:['27.3 天','29.53 天','30 天','365 天'],
    a:1, why:'月球绕地球公转一周与日地相对位置复原的周期为朔望月，约 29.53 天。' },
  { q:'新月（朔）时，月球位于（　）',
    opts:['太阳与地球之间','地球背向太阳的一侧','地球北极上方','地球南极下方'],
    a:0, why:'朔时日月地近似一线，月球位于太阳与地球之间，暗面朝向地球。' },
  { q:'满月（望）时，月球位于（　）',
    opts:['太阳与地球之间','地球背向太阳的一侧','地球侧面 90°','任意位置'],
    a:1, why:'望时地球位于太阳与月球之间，月球的亮面完全朝向地球。' },
  { q:'上弦月时，我们看到的亮面（　）',
    opts:['朝东（左）','朝西（右），弓背朝右','全亮','全暗'],
    a:1, why:'上弦月出现在农历初七、初八，亮面朝西，呈半圆形。' },
  { q:'农历二十二、二十三出现的月相是（　）',
    opts:['上弦月','满月','下弦月','新月'],
    a:2, why:'下弦月出现在农历二十二、二十三，亮面朝东。' },
  { q:'月相变化的根本原因是（　）',
    opts:['地球自转','月球绕地球公转，日月地相对位置变化','太阳活动','地球公转'],
    a:1, why:'月球绕地球公转使日月地三者相对位置不断变化，从而产生月相变化。' },
  { q:'蛾眉月出现在农历（　）',
    opts:['初一','初三、初四','十五、十六','二十二、二十三'],
    a:1, why:'蛾眉月出现在农历初三、初四，呈弯月状，亮面朝西。' },
  { q:'满月（望）出现在农历（　）',
    opts:['初一','初七、初八','十五、十六','月末'],
    a:2, why:'满月出现在农历十五、十六，月面全亮呈正圆形。' },
];
const quiz={i:0,score:0,answered:false};
const $=id=>document.getElementById(id);
function openQuiz(){
  if(isPlaying)btnPlay.click();
  $('quiz').classList.remove('hidden');
  quiz.i=0;quiz.score=0;
  renderQuiz();
}
function closeQuiz(){ $('quiz').classList.add('hidden'); }
function renderQuiz(){
  const item=QUIZ[quiz.i];
  quiz.answered=false;
  $('quiz-prog').textContent='第 '+(quiz.i+1)+'/'+QUIZ.length+' 题';
  $('quiz-q').textContent=(quiz.i+1)+'. '+item.q;
  $('quiz-opts').innerHTML=item.opts.map((o,k)=>
    '<button class="qopt" data-k="'+k+'">'+String.fromCharCode(65+k)+'. '+o+'</button>').join('');
  $('quiz-why').className='';
  $('quiz-why').textContent='';
  $('quiz-score').textContent='得分：'+quiz.score;
  const nb=$('quiz-next');
  nb.textContent=quiz.i===QUIZ.length-1?'查看结果':'下一题 ›';
  nb.style.display='none';
  $('quiz-opts').querySelectorAll('.qopt').forEach(b=>
    b.addEventListener('click',()=>answerQuiz(parseInt(b.dataset.k,10))));
  $('quiz-exit').style.display='inline-block';
  $('quiz-restart')&&$('quiz-restart').remove();
}
function answerQuiz(k){
  if(quiz.answered)return;
  quiz.answered=true;
  const item=QUIZ[quiz.i];
  const opts=$('quiz-opts').querySelectorAll('.qopt');
  opts.forEach(b=>b.disabled=true);
  if(k===item.a){quiz.score++;opts[k].classList.add('correct');}
  else{opts[k].classList.add('wrong');opts[item.a].classList.add('correct');}
  $('quiz-score').textContent='得分：'+quiz.score;
  $('quiz-why').textContent='解析：'+item.why;
  $('quiz-why').classList.add('show');
  $('quiz-next').style.display='inline-block';
}
function nextQuiz(){
  quiz.i++;
  if(quiz.i>=QUIZ.length)return showQuizResult();
  renderQuiz();
}
function showQuizResult(){
  $('quiz-prog').textContent='';
  $('quiz-q').textContent='测验完成！';
  $('quiz-opts').innerHTML='<p style="font-size:19px;line-height:1.6">'+
    '共 '+QUIZ.length+' 题，答对 '+quiz.score+' 题'+
    (quiz.score>=6?'，掌握得很好！🌕':'，再观察一下月相变化吧。🌙')+'</p>';
  $('quiz-why').className='';
  $('quiz-score').textContent='得分：'+quiz.score+' / '+QUIZ.length;
  $('quiz-next').style.display='none';
  $('quiz-exit').style.display='none';
  const rb=document.createElement('button');
  rb.className='qbtn gold';rb.id='quiz-restart';rb.textContent='↺ 重新测验';
  rb.addEventListener('click',()=>{quiz.i=0;quiz.score=0;renderQuiz();});
  $('quiz-foot').querySelector('div').appendChild(rb);
}
document.getElementById('btn-quiz').addEventListener('click',openQuiz);
document.getElementById('quiz-next').addEventListener('click',nextQuiz);
document.getElementById('quiz-exit').addEventListener('click',closeQuiz);

// ================================================================
//  动画循环
// ================================================================
const CYCLE_SECONDS=28; // slower for better viewing
const SPEED=1000/CYCLE_SECONDS;
const clock=new THREE.Clock();
let accumulated=0; // 从新月（朔）开始
window.__getMoonVal=()=>accumulated/1000;   // 测试钩子（无副作用）

// ================================================================
// 接收平台控制栏的 postMessage 指令
// ================================================================
window.addEventListener('message',(e)=>{
  if(!e.data||!e.data.action) return;
  switch(e.data.action){
    case 'play':
      if(hasCompletedCycle){ hasCompletedCycle=false; accumulated=0; }
      isPlaying=true; btnPlay.textContent='⏸';
      playStatus.textContent='自动播放'; playStatus.className='status on';
      break;
    case 'pause':
      isPlaying=false; btnPlay.textContent='▶';
      playStatus.textContent='已暂停'; playStatus.className='status';
      break;
    case 'reset':
      hasCompletedCycle=false; accumulated=0; isPlaying=false;
      btnPlay.textContent='▶'; playStatus.textContent='已重置'; playStatus.className='status';
      updateAll(0);
      break;
    case 'speed':
      if(e.data.value){ speed=parseFloat(e.data.value); spdDisplay.textContent=speed.toFixed(1)+'×'; spdSlider.value=speed; }
      break;
  }
});

// Initial update
updateAll(Math.round(accumulated));
document.getElementById('loader').style.opacity='0';
setTimeout(()=>document.getElementById('loader').style.display='none',1000);

// Resize
window.addEventListener('resize',()=>{
  const w=container.clientWidth,h=container.clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

// Sun label update
function updateLabels(){
  const v=new THREE.Vector3();earthGroup.getWorldPosition(v);
  v.project(camera);
  const w=window.innerWidth,h=window.innerHeight;
  const x=(v.x*.5+.5)*w,y=(-v.y*.5+.5)*h;
  if(v.z<1&&earthLabel){earthLabel.style.display='block';earthLabel.style.left=x+'px';earthLabel.style.top=y+'px';}
  else if(earthLabel)earthLabel.style.display='none';
}

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  // Advance phase
  if(isPlaying){
    accumulated+=SPEED*dt*speed;
    if(accumulated>=1000){
      accumulated-=1000;
      if(!hasCompletedCycle){
        // 完成一整轮，自动停止
        hasCompletedCycle=true;
        isPlaying=false;
        accumulated=0;
        btnPlay.textContent='▶';
        playStatus.textContent='一轮完成';
        playStatus.className='status';
      }
    }
  }
  const val=Math.round(accumulated);

  // Update
  if(val!==parseInt(spdSlider.dataset.last||'0')){
    spdSlider.dataset.last=val;
    updateAll(val);
  }

  // 相机随月相自动归位：始终从"地球方向"（太阳对侧）观察月球，
  // 保证大月球明暗与俯视图、时间线的月相严格一致；拖拽可临时改变视角，松手后自动回正
  const now=performance.now();
  if(!isDragging&&now-lastInteraction>2000){
    // 相机回正到固定"地球视角"（+Z）：月球绕地球公转由太阳绕转表现，
    // 地球观察者位置不动——所见月相才与俯视图、时间线严格一致
    let diff=-camTheta;
    diff=((diff+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    camTheta+=diff*(1-Math.exp(-dt*2.5));   // 指数平滑：约 1.2s 回正
  }

  // Apply camera
  const targetDist=camDist;
  camera.position.set(
    targetDist*Math.cos(camPhi)*Math.sin(camTheta),
    targetDist*Math.sin(camPhi),
    targetDist*Math.cos(camPhi)*Math.cos(camTheta)
  );
  camera.lookAt(0,0,0);

  // 月球潮汐锁定——始终以同一面朝向地球（不自转）
  // moon.rotation.y+=dt*.002; // 已移除：与实际潮汐锁定不符

  // Earth self-rotation
  // earthMesh&&(earthMesh.rotation.y+=dt*.08);

  // Stars slow rotation
  nearStars.mesh.rotation.y+=dt*.00008;
  farStars.mesh.rotation.y-=dt*.00003;

  // Subtle earthshine variation
  earthshine.intensity=.02+.01*Math.sin(clock.elapsedTime*.3);

  // Update 3D Earth position (relative to moon)
  // Earth is placed to appear along the natural viewing direction

  // Labels
  // updateLabels(); // 已移除地球标签

  renderer.render(scene,camera);
}
animate();
